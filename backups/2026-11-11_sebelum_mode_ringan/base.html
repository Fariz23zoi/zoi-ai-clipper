<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{% block title %}ZOI AI CLIPPER{% endblock %}</title>
<style>
:root{
  --bg:#0d0e14;--surface:#181924;--raised:#222332;--line:#33354a;
  --text:#f2f2f7;--muted:#a3a5b8;--accent:#9385ff;--accent-strong:#7565ef;
  --ok:#83d9a0;--warn:#f1c56b;--bad:#ff8f8f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.logo{font-size:22px;font-weight:700;color:var(--accent);text-decoration:none;letter-spacing:.2px}
.tagline{color:var(--muted);font-size:13px;margin:0 0 8px}
a{color:var(--accent)}
h1{font-size:19px;margin:0 0 6px;line-height:1.3}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px;line-height:1.35}
p{margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.muted{color:var(--muted);font-size:13px}
.small{font-size:13px}
label.field{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input[type=url],textarea,select{width:100%;padding:13px 12px;border-radius:10px;border:1px solid var(--line);
  background:#0f1017;color:var(--text);font:inherit}
textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;resize:vertical}
input[type=file]{width:100%;color:var(--muted);font-size:13px;padding:8px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:11px 16px;
  border:1px solid transparent;border-radius:10px;background:var(--accent-strong);color:#fff;font:inherit;
  font-weight:600;text-decoration:none;cursor:pointer;width:100%;text-align:center}
.btn.secondary{background:transparent;border-color:var(--line);color:var(--text)}
.btn.inline{width:auto;min-height:40px;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 150px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.alert{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px;overflow-wrap:anywhere;border:1px solid}
.alert.bad{border-color:#7a3b3b;background:#2a1719;color:#ffc9c9}
.alert.ok{border-color:#2f6b45;background:#13251a;color:#bdeccb}
.alert.info{border-color:#4a4580;background:#1c1a33;color:#d6d0ff}
.alert ul{margin:6px 0 0;padding-left:18px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0;padding:0;border:0}
.modes legend{font-weight:600;font-size:14px;padding:0;margin-bottom:8px}
.mode span.body{display:block;height:100%;background:var(--raised);border:1px solid var(--line);
  padding:12px 10px;border-radius:11px;cursor:pointer}
.mode input:checked + span.body{border-color:var(--accent);background:#2d2950;box-shadow:inset 0 0 0 1px var(--accent)}
.mode input:focus-visible + span.body{outline:2px solid var(--accent);outline-offset:2px}
.mode strong{display:block;margin-bottom:3px}
.mode small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.clip{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.score{color:var(--ok);border-color:#2f6b45}
.chip.agree{color:var(--accent);border-color:#4a4580}
.hook{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:8px 0}
.warn{color:var(--warn);font-size:13px;margin:6px 0 0}
details{margin-top:14px}
details > summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:44px;font-weight:600}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1}
details[open] > summary::after{content:"\2212"}
details.card > summary{margin:-4px 0}
.bar{background:#2c2e40;border-radius:999px;height:14px;overflow:hidden}
.bar > div{height:100%;width:0;background:var(--accent);transition:width .3s}
.bar.busy > div{width:35%;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.percent{font-size:30px;font-weight:700;margin:10px 0 0;font-variant-numeric:tabular-nums}
ol.steps{margin:0 0 4px;padding-left:20px}
ol.steps li{margin-bottom:8px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .name{min-width:0;overflow-wrap:anywhere}
.list a.title{color:var(--text);text-decoration:none;font-weight:600}
video{width:100%;max-width:360px;border-radius:12px;background:#000;display:block;margin:10px auto}
footer{text-align:center;color:#74768a;margin-top:28px;font-size:12px}
@media (max-width:380px){.modes{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  .bar > div{transition:none}
  .bar.busy > div{animation:none;width:100%;opacity:.45}
}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="logo" href="{{ url_for('home') }}">ZOI AI CLIPPER</a>
</header>
<p class="tagline">Studio clipping video lokal di HP Anda</p>
{% block content %}{% endblock %}
<footer>ZOI AI CLIPPER &copy; 2026</footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
